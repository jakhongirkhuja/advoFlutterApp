name: vatandoshlar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  google_maps_flutter: ^2.7.0
  speech_to_text: ^7.4.0
  camera: ^0.11.4
  file_picker: ^8.1.1
  record: ^7.1.1
  audioplayers: ^6.1.0
  video_player: ^2.8.1
  chewie: ^1.7.1
  device_info_plus: ^11.1.0
  intl_phone_field: ^3.2.0
  mask_text_input_formatter: ^2.5.0
  flutter_libphonenumber: ^2.0.2
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  shimmer: ^3.0.0
  geolocator: ^11.0.0
  workmanager: ^0.10.1+2
  url_launcher: ^6.3.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1
  flutter_native_splash: ^2.4.4
  package_info_plus: ^9.0.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#165EA9"
  image: assets/images/flash_screen.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    image: assets/images/flash_screen.png
    color: "#165EA9"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
