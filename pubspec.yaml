name: vatandoshlar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.3.2
  device_info_plus: ^13.2.0
  intl_phone_field: ^3.2.0
  mask_text_input_formatter: ^2.5.0
  flutter_libphonenumber: ^2.0.2
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  geolocator: ^14.0.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_native_splash: ^2.4.4
  package_info_plus: ^10.2.1
  flutter_svg: ^2.3.0
  google_maps_flutter: ^2.18.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#165EA9"
  image: assets/images/flash_screen.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    image: assets/images/flash_screen.png
    color: "#165EA9"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
